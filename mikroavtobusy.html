<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Микроавтобусы — ЦТС</title><style>
:root{--navy:#052b4a;--dark:#061e37;--sky:#eaf5fc;--line:#d7e6f0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(#f7fcff,#eaf5fc);color:#092e51;font-family:Arial,Helvetica,sans-serif}a{color:inherit}.top{background:linear-gradient(110deg,#041e38,#07406a 60%,#052d4e);color:#fff}.nav{max-width:1280px;margin:auto;display:flex;align-items:center;gap:22px;padding:15px 20px;border-bottom:1px solid #ffffff29}.logo{display:flex;align-items:center;gap:12px;text-decoration:none;white-space:nowrap}.logo b{font-size:36px;letter-spacing:-2px}.logo small{font-size:10px;line-height:1.1}.links{display:flex;align-items:center;gap:24px;margin-left:auto;flex-wrap:wrap}.links a{text-decoration:none;font-size:13px}.links .primary{background:#088be4;padding:12px 18px;border-radius:5px;font-weight:bold}.hero{max-width:1280px;margin:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:18px 20px 22px}.hero h1{font-size:clamp(29px,3.4vw,44px);line-height:1.1;margin:0 0 6px;letter-spacing:-1px}.hero p{margin:0;color:#d9e8f6}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters button{background:#092f51;border:1px solid #678aaa;color:#fff;border-radius:5px;padding:11px 13px;cursor:pointer}.filters button.active{background:#fff;color:#07304f;font-weight:bold}.main{max-width:1280px;padding:16px 20px 48px;margin:auto}.section{margin-bottom:22px}.section h2{font-size:19px;margin:0 0 9px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;text-transform:uppercase}.section h2 small{font-size:11px;font-weight:400;color:#678398;text-transform:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{min-width:0;overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 3px 13px #082d4b12;border:1px solid #e0ebf3;display:flex;flex-direction:column}.photo{width:100%;display:block;height:auto;aspect-ratio:2.4/1;object-fit:contain;background:#e8f3fa}.content{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}.content h3{font-size:14px;margin:0 0 8px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.tag{padding:5px 8px;border-radius:4px;background:#f3e5c8;color:#51462b;font-size:10px}.tag.blue{background:#d9ecfb;color:#164d77}.spec{display:flex;justify-content:space-between;gap:10px;color:#6a8397;font-size:11px;margin-bottom:9px}.spec strong{color:#092e51}.cta{display:block;background:#06345a;color:white;text-align:center;text-decoration:none;font-size:11px;font-weight:bold;padding:10px 7px;border-radius:4px;margin-top:auto}.cta:hover{background:#006caa}.foot{background:#062842;color:#d7e8f4;text-align:center;padding:23px 12px;font-size:12px}.foot a{color:#fff}.note{font-size:11px;color:#617d91;margin:28px 0 0}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.links{gap:10px}}@media(max-width:610px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start;flex-wrap:wrap}.links{margin-left:0}.hero{padding-top:25px}.filters button{padding:9px}}
</style></head><body><div class="top"><div class="nav"><a class="logo" href="https://ctstransport.ru/"><b>ЦТС</b><small>ЦЕНТР<br>ТРАНСПОРТНОГО<br>СНАБЖЕНИЯ</small></a><nav class="links"><a href="https://ctstransport.ru/">О компании</a><a href="https://ctstransport.ru/">Каталог</a><a href="https://ctstransport.ru/">Производители</a><a href="https://ctstransport.ru/">Контакты</a><a class="primary" href="mailto:ctstransport@yandex.ru?subject=Подбор%20микроавтобуса">Запросить подбор →</a></nav></div><div class="hero"><div><h1>МИКРОАВТОБУСЫ</h1><p>Комфорт, надёжность и статус в каждой поездке</p></div><nav class="filters"><button class="active" data-filter="Все модели">Все модели</button><button data-filter="Пассажирские">Пассажирские</button><button data-filter="Бизнес-класс">Бизнес-класс</button><button data-filter="Представительский класс">Представительский класс</button></nav></div></div><main class="main" id="catalog"></main><footer class="foot">ЦЕНТР ТРАНСПОРТНОГО СНАБЖЕНИЯ · <a href="mailto:ctstransport@yandex.ru">ctstransport@yandex.ru</a> · <a href="https://ctstransport.ru/">На главную</a></footer><script>
const models=[["Mercedes-Benz Sprinter", "sprinter", "Пассажирские"], ["Sollers Atlant", "atlant", "Пассажирские"], ["Foton Toano", "toano", "Пассажирские"], ["Mercedes-Benz V-Class", "vclass", "Бизнес-класс"], ["Volkswagen Multivan", "multivan", "Бизнес-класс"], ["GAC M8", "gacm8", "Бизнес-класс"], ["Hongqi HQ9", "hongqi", "Представительский класс"], ["Zeekr 009", "zeekr", "Представительский класс"], ["Voyah Dream", "voyah", "Представительский класс"]];const categories=[['Пассажирские','Для корпоративных, служебных и групповых перевозок'],['Бизнес-класс','Для деловых поездок, встреч и трансферов'],['Представительский класс','Для официальных делегаций и персонального сопровождения']];const root=document.getElementById('catalog');function render(filter='Все модели'){root.innerHTML=categories.filter(c=>filter==='Все модели'||filter===c[0]).map(c=>`<section class="section"><h2>${c[0]} <small>${c[1]}</small></h2><div class="grid">${models.filter(m=>m[2]===c[0]).map(m=>`<article class="card"><img class="photo" src="images/${m[1]}.webp" alt="Иллюстрация ${m[0]}" width="402" height="166"><div class="content"><h3>${m[0]}</h3><div class="tags"><span class="tag">${m[2]}</span><span class="tag blue">Подбор комплектации</span></div><div class="spec"><span>Двигатель / оснащение</span><strong>По запросу</strong></div><a class="cta" href="mailto:ctstransport@yandex.ru?subject=${encodeURIComponent('Запрос комплектации '+m[0])}">Запросить комплектацию и стоимость →</a></div></article>`).join('')}</div></section>`).join('')+`<p class="note">Изображения являются художественными иллюстрациями оформления каталога, а не подтверждёнными фотографиями конкретных комплектаций. Внешний вид поставляемой техники уточняется при подборе.</p>`;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter)})}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>render(b.dataset.filter));render();
</script></body></html>
